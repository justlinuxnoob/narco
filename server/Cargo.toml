[package]
name = "narco-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "Blind in-memory WebSocket relay for Narco"
repository = "https://github.com/justlinuxnoob/narco"

# This crate has no dependency on `narco-proto`, and must never gain one.
# The relay holds no keys and performs no cryptography; adding the protocol
# crate here would be a red flag in review.
[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
