name: ci

on:
  push:
    branches: [main]
    # A release pushes main and a tag together; without this both workflows run
    # and compete for runners for the same commit.
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The security-critical crates. Fast, no system dependencies, no network.
  test:
    name: test protocol + tor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          cargo fmt --manifest-path crates/narco-proto/Cargo.toml -- --check
          cargo fmt --manifest-path crates/narco-tor/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path crates/narco-proto/Cargo.toml -- -D warnings
          cargo clippy --manifest-path crates/narco-tor/Cargo.toml -- -D warnings

      - name: Test
        run: |
          cargo test --manifest-path crates/narco-proto/Cargo.toml
          cargo test --manifest-path crates/narco-tor/Cargo.toml


  # Only on pull requests. A push to main that matters is tagged, and the tag
  # already builds both platforms for real — running this too meant four jobs
  # compiling the same commit and competing for runners with the release
  # someone is waiting on.
  build:
    name: build ${{ matrix.os }}
    if: github.event_name != 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Tauri's Linux prerequisites. Not needed on Windows.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev build-essential curl wget file libssl-dev

      - name: Install frontend
        working-directory: app
        run: npm ci

      # No bundler: this job answers "does it still compile on both platforms",
      # and the packaging it used to run needs the tor daemon fetched, which
      # only the release workflow does. Bundling here would fail looking for
      # resources that are not there.
      - name: Build
        working-directory: app
        run: npm run tauri build -- --no-bundle
