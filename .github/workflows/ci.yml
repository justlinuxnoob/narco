name: ci

on:
  push:
    branches: [main]
    # A release pushes main and a tag together; without this both workflows run
    # and compete for runners for the same commit.
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The security-critical crates. Fast, no system dependencies, no network.
  test:
    name: test protocol + tor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          cargo fmt --manifest-path crates/narco-proto/Cargo.toml -- --check
          cargo fmt --manifest-path crates/narco-tor/Cargo.toml -- --check
          cargo fmt --manifest-path server/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path crates/narco-proto/Cargo.toml -- -D warnings
          cargo clippy --manifest-path server/Cargo.toml -- -D warnings

      - name: Test
        run: |
          cargo test --manifest-path crates/narco-proto/Cargo.toml
          cargo test --manifest-path crates/narco-tor/Cargo.toml
          cargo test --manifest-path server/Cargo.toml

      # The relay must never gain a dependency on the protocol crate: it holds
      # no keys, and "it cannot decrypt" should stay checkable from the manifest.
      #
      # Uses cargo metadata rather than grep. Grepping the manifest matches the
      # comment that documents this very rule, which is a false positive, and it
      # would also miss a dependency introduced under an alias or a target-
      # specific table.
      - name: Relay stays blind
        run: |
          deps=$(cargo metadata --manifest-path server/Cargo.toml \
                   --format-version 1 --no-deps \
                 | jq -r '.packages[0].dependencies[].name')
          echo "relay dependencies: $(echo "$deps" | tr '\n' ' ')"
          if echo "$deps" | grep -qx 'narco-proto'; then
            echo "::error::server/ must not depend on narco-proto — the relay holds no keys"
            exit 1
          fi

  build:
    name: build ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Tauri's Linux prerequisites. Not needed on Windows.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev build-essential curl wget file libssl-dev

      - name: Install frontend
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: narco-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
