name: android

# Kept separate from the desktop release on purpose: Android is the least
# proven target here, and a failure in it must never hold back a Windows or
# Linux build that people are waiting on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the APK to (e.g. v0.6.0)"
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006" "platforms;android-34" \
                               "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only the ABIs worth shipping: arm64 is every modern phone, armv7
          # covers older ones, x86_64 is for emulators.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V="${{ github.ref_name }}"; V="${V#v}"
          node -e "
            const f='app/src-tauri/tauri.conf.json';
            const j=JSON.parse(require('fs').readFileSync(f,'utf8'));
            j.version='$V';
            require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n');
          "
          sed -i -E "0,/^version = .*/s//version = \"$V\"/" app/src-tauri/Cargo.toml

      - name: Install frontend
        working-directory: app
        run: npm ci

      # Generates gen/android. Must run before the daemon can be dropped into
      # jniLibs, because this is what creates that tree.
      - name: Initialise the Android project
        working-directory: app
        run: npm run tauri android init

      # Android stopped unpacking native libraries by default in Android 6: they
      # are mapped straight out of the APK instead. That is fine for something
      # you dlopen and fatal for something you exec — an unextracted library is
      # not a file, so there is nothing to run and nothing in /proc/self/maps
      # pointing at a directory to run it from. The 0.5.7 APK installed and then
      # reported it could not find its own daemon for exactly this reason.
      #
      # Both switches are needed: the manifest attribute is what older Android
      # reads, and useLegacyPackaging is what AGP 8 uses to decide whether to
      # compress them in the first place.
      - name: Make Android unpack the native libraries
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=app/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          GRADLE=app/src-tauri/gen/android/app/build.gradle.kts
          python3 - "$MANIFEST" "$GRADLE" <<'PY'
          import re, sys
          manifest, gradle = sys.argv[1], sys.argv[2]

          s = open(manifest).read()
          if 'extractNativeLibs' not in s:
              s = s.replace('<application', '<application android:extractNativeLibs="true"', 1)
              open(manifest, 'w').write(s)
          assert 'extractNativeLibs="true"' in open(manifest).read(), "manifest not patched"

          g = open(gradle).read()
          if 'useLegacyPackaging' not in g:
              g = re.sub(r'(?m)^android\s*\{',
                         'android {\n    packaging { jniLibs { useLegacyPackaging = true } }',
                         g, count=1)
              open(gradle, 'w').write(g)
          assert 'useLegacyPackaging' in open(gradle).read(), "gradle not patched"
          print("native libraries will be unpacked on install")
          PY

      # Android will not execute a file outside the app's native library
      # directory. Tor ships its daemon as libTor.so for exactly this reason, so
      # it installs as a native library and is executable where it lands.
      - name: Add the tor daemon for each ABI
        shell: bash
        run: |
          set -euo pipefail
          TOR_VERSION="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            https://aus1.torproject.org/torbrowser/update_3/release/downloads.json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))")"
          echo "tor version: $TOR_VERSION"
          case "$TOR_VERSION" in
            [0-9]*.[0-9]*) : ;;
            *) echo "::error::could not resolve the tor version (got '$TOR_VERSION') — the update feed fetch failed" ; exit 1 ;;
          esac

          JNI=app/src-tauri/gen/android/app/src/main/jniLibs
          # Tor's architecture names on the left, Android's on the right.
          for pair in "aarch64:arm64-v8a" "armv7:armeabi-v7a" "x86_64:x86_64"; do
            TOR_ARCH="${pair%%:*}"; ABI="${pair##*:}"
            url="https://dist.torproject.org/torbrowser/${TOR_VERSION}/tor-expert-bundle-android-${TOR_ARCH}-${TOR_VERSION}.tar.gz"
            echo "fetching $ABI from $url"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "teb-${ABI}.tar.gz" "$url"
            mkdir -p "$JNI/$ABI"
            tar xzf "teb-${ABI}.tar.gz" -C "$JNI/$ABI" --strip-components=1 tor/libTor.so
            test -f "$JNI/$ABI/libTor.so"
          done
          find "$JNI" -name 'libTor.so' -printf '%p %s bytes\n'

          # tauri.conf.json declares resources: ["tor/*"] for the desktop
          # builds, and the build script treats a glob that matches nothing as
          # a hard error. tauri.android.conf.json clears that list, but this
          # placeholder keeps the glob satisfied either way — the daemon itself
          # travels in jniLibs above, not as a resource.
          mkdir -p app/src-tauri/tor
          echo "The tor daemon ships in jniLibs on Android; see android.yml." \
            > app/src-tauri/tor/README.txt

      # Release, not debug. A debug build carries unstripped Rust symbols — 144
      # MB per ABI, 586 MB of APK — which is not a thing anyone will download.
      #
      # --target is explicit because `tauri android init` configures four ABIs
      # and Tor publishes only three. Without this, x86 got our library and no
      # daemon, so the app would install on such a device and then fail looking
      # for a tor that was never packaged.
      - name: Build the APK
        working-directory: app
        run: |
          npm run tauri android build -- --apk \
            --target aarch64 --target armv7 --target x86_64

      # Android refuses to install an unsigned APK, and `tauri android build`
      # without --debug produces one. Prefer a real key held as a repository
      # secret so builds can upgrade over each other; fall back to a throwaway
      # so the workflow still yields something installable.
      - name: Sign the APK
        id: sign
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="$(find app/src-tauri/gen/android -name '*-unsigned.apk' -o -name '*release*.apk' | head -1)"
          test -n "$unsigned"
          echo "signing $unsigned"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > key.jks
            PASS="$KEYSTORE_PASSWORD"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a throwaway key. This APK cannot be upgraded over — uninstall the previous version first."
            PASS=narcobuild
            keytool -genkeypair -dname "CN=Narco, OU=Narco, O=Narco, L=-, S=-, C=-" \
              -alias narco -keystore key.jks -storepass "$PASS" -keypass "$PASS" \
              -keyalg RSA -keysize 4096 -validity 10000
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 "$unsigned" aligned.apk
          "$BT/apksigner" sign --ks key.jks --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" --ks-key-alias narco --out signed.apk aligned.apk
          "$BT/apksigner" verify --print-certs signed.apk | head -3
          rm -f key.jks aligned.apk

      - name: Collect the APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # A manual run has no tag, and "Narco_main_android.apk" tells nobody
          # which build they are holding.
          V="${{ github.event.inputs.tag || github.ref_name }}"; V="${V#v}"
          if [ "$V" = "main" ]; then
            V="$(node -p "require('./app/src-tauri/tauri.conf.json').version")-dev"
          fi
          cp signed.apk "out/Narco_${V}_android.apk"
          ls -la out
          du -h out/*.apk
          # Every ABI that ships must carry a daemon, or the app installs and
          # then cannot start on that device.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "out/Narco_${V}_android.apk" | grep -q "lib/$abi/libTor.so" \
              || { echo "::error::$abi has no libTor.so"; exit 1; }
          done
          echo "every shipped ABI carries the tor daemon"

      - uses: actions/upload-artifact@v4
        with:
          name: narco-android-apk
          retention-days: 14
          path: out/*.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*.apk
          fail_on_unmatched_files: false
