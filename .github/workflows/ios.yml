name: ios

# Separate from the desktop release for the same reason Android is: iOS is the
# least proven target here and must never hold back a build people are waiting
# on. It also needs a macOS runner, which is slower and more contended.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: ipa
    runs-on: macos-15
    # Hoisted to the job so the upload step can test it. `secrets` is not one of
    # the contexts available to a step's `if`, and using it there does not fail
    # the step — it makes the whole workflow unparseable, which is why the run
    # showed up under a file path instead of a name.
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      # Never empty. An absent variable and an empty one are different things
      # to `tauri ios init`: absent means "unsigned build, carry on", empty is a
      # hard error. Hoisting the secrets to job level turned the first into the
      # second and broke a step that had been passing.
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'XXXXXXXXXX' }}
    steps:
      - uses: actions/checkout@v4

      # Tauri writes an Xcode 16 project format (77). Whatever the runner
      # image defaults to, take the newest Xcode it actually has rather than
      # pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Device and simulator. The simulator target is what makes a build
          # possible at all without a signing identity.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V="${{ github.ref_name }}"; V="${V#v}"
          node -e "
            const f='app/src-tauri/tauri.conf.json';
            const j=JSON.parse(require('fs').readFileSync(f,'utf8'));
            j.version='$V';
            require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n');
          "
          sed -i '' -E "1,/^version = / s/^version = .*/version = \"$V\"/" \
            app/src-tauri/Cargo.toml

      - name: Install frontend
        working-directory: app
        run: npm ci

      # The same C tor the other three platforms run, as a static library
      # instead of a binary — because iOS will not execute a second binary.
      # Published by the Tor.framework project, which is what Onion Browser and
      # Orbot iOS ship, and the release below is tor 0.4.9.11: the identical
      # version the Expert Bundle gives Windows, Linux and Android.
      # The same C tor the other three platforms run, as a static library
      # rather than a binary — because iOS will not execute a second binary.
      # Published by the Tor.framework project, which is what Onion Browser and
      # Orbot iOS ship, and this release is tor 0.4.9.11: the identical version
      # the Expert Bundle gives Windows, Linux and Android.
      - name: Fetch the tor xcframework
        shell: bash
        run: |
          set -euo pipefail
          TAG=v409.11.2
          url="https://github.com/iCepa/Tor.framework/releases/download/$TAG/tor.xcframework.zip"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o tor-xcf.zip "$url"
          mkdir -p vendor && unzip -q tor-xcf.zip -d vendor
          ls vendor/tor.xcframework

          # One slice per target. Device and simulator are different libraries
          # and linking the wrong one fails late and confusingly.
          dev="$PWD/vendor/tor.xcframework/ios-arm64"
          sim="$PWD/vendor/tor.xcframework/ios-arm64_x86_64-simulator"
          test -d "$dev" && test -d "$sim"
          echo "TOR_XCF_DEVICE=$dev" >> "$GITHUB_ENV"
          echo "TOR_XCF_SIM=$sim" >> "$GITHUB_ENV"

          # Reported, never gated. Gating on this rejected a correct framework
          # twice — once on nm's flags, once because `grep -q` closes the pipe
          # on its first match, `strings` dies of SIGPIPE and `pipefail` calls
          # the pipeline failed, so *finding* the symbol is what made the check
          # say it was missing. Linking is the real test and says "undefined
          # symbol: _tor_run_main" plainly enough.
          lib="$(find "$dev" -type f -name tor | head -1)"
          echo "device library: ${lib:-none found}"
          if [ -n "$lib" ]; then
            found=$(strings -a "$lib" 2>/dev/null | grep -cx "tor_run_main" || true)
            echo "tor_run_main occurrences: ${found:-0}"
          fi

      # Answers the question that actually matters first: does Arti compile for
      # a real iPhone at all? It pulls in a large dependency tree and a C SQLite
      # build, and if this fails nothing downstream is worth attempting.
      - name: Does the Tor engine build for iOS?
        env:
          NARCO_TOR_XCFRAMEWORK: ${{ env.TOR_XCF_DEVICE }}
        run: cargo build --manifest-path crates/narco-tor/Cargo.toml --target aarch64-apple-ios

      # tauri.conf.json declares resources: ["tor/*"] so the desktop builds
      # carry the daemon, and a glob matching nothing is a hard error. iOS
      # ships no daemon — Arti is compiled into the binary — so that directory
      # does not exist. tauri.ios.conf.json clears the list; this placeholder
      # satisfies the glob even if the platform config is not picked up.
      - name: Placate the desktop resource glob
        run: |
          mkdir -p app/src-tauri/tor
          echo "iOS links Arti instead of shipping a daemon; see ios.yml." \
            > app/src-tauri/tor/README.txt

      - name: Initialise the iOS project
        working-directory: app
        run: npm run tauri ios init

      # Unsigned, for the simulator. This proves the whole app links — Rust,
      # Arti and the Tauri iOS shell — without needing a signing identity, so it
      # runs on every push whether or not the secrets below exist.
      - name: Build for the simulator
        working-directory: app
        env:
          NARCO_TOR_XCFRAMEWORK: ${{ env.TOR_XCF_SIM }}
        run: npm run tauri ios build -- --target aarch64-sim

      # Everything past here needs an App Store Connect API key. Without the
      # secrets the job still succeeds, having proved the build.
      #
      # This drives xcodebuild directly rather than going through
      # `tauri ios build`. Xcode will create the signing certificate and
      # provisioning profile itself given an API key, but only when the key is
      # passed as -authenticationKey* flags, and the Tauri CLI does not expose
      # them — so Xcode looked for a signed-in account, found none, and failed
      # with "No Accounts". Dropping the key in ~/.appstoreconnect is enough for
      # altool and not for xcodebuild.
      #
      # Nothing is lost by going direct: the generated project has a "Build Rust
      # Code" script phase, so xcodebuild compiles the Rust and Arti itself.
      - name: Sign and upload to TestFlight
        if: ${{ env.ASC_KEY_ID != '' }}
        run: |
          set -euo pipefail
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          key="$keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"

          # Apple answering 401 means the credentials were rejected, which is
          # a different problem to the plumbing being wrong and needs telling
          # apart. Checks shape only — nothing here prints a secret.
          echo "--- credential shape ---"
          if openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "  private key: valid PEM"
          else
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is not a valid PEM key. Paste the whole .p8 including the BEGIN and END lines, with its line breaks."
            exit 1
          fi
          echo "  key id:    ${#ASC_KEY_ID} chars (Apple issues 10)"
          echo "  issuer id: ${#ASC_ISSUER_ID} chars (Apple issues a 36-char UUID)"
          echo "  team id:   ${#APPLE_DEVELOPMENT_TEAM} chars (Apple issues 10)"
          case "$ASC_ISSUER_ID" in
            ????????-????-????-????-????????????) : ;;
            *) echo "::error::APP_STORE_CONNECT_ISSUER_ID is not a UUID. It is the 'Issuer ID' at the top of the Integrations page — not the Key ID, and not the Team ID." ; exit 1 ;;
          esac

          # Two tools, one each of the two things needed, and neither can do
          # the other's job.
          #
          # Only xcodebuild can turn an API key into a signing certificate and a
          # provisioning profile — the Tauri CLI has no flags for it, which is
          # why Xcode previously reported "No Accounts".
          #
          # Only the Tauri CLI can build. Its Xcode project runs the Rust
          # compile in a script phase that calls back to the CLI over a local
          # socket for its options, so driving xcodebuild directly dies with
          # "failed to read CLI options: ConnectionRefused" — there is no CLI
          # listening.
          #
          # So: run xcodebuild once purely to make Xcode create the credentials.
          # It will fail at that Rust phase, which is expected and ignored;
          # provisioning happens before it, so the certificate and profile are
          # on the machine afterwards. Then let the Tauri CLI build normally and
          # find them.
          # Removed along with the block this replaced, which is what produced
          # "auth[@]: unbound variable".
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          echo "--- priming signing assets ---"
          xcodebuild "${auth[@]}" \
            -workspace "app/src-tauri/gen/apple/narco-app.xcodeproj/project.xcworkspace" \
            -scheme narco-app_iOS -sdk iphoneos -configuration release \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            build 2>&1 | grep -iE "ProcessProductPackaging|error:" | head -5 || true

          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          count=$(ls "$profiles" 2>/dev/null | wc -l | tr -d ' ')
          echo "provisioning profiles on the machine: $count"
          security find-identity -v -p codesigning | tail -2
          if [ "$count" = "0" ]; then
            echo "::error::Xcode did not produce a provisioning profile for app.narco.chat"
            exit 1
          fi

          # The CLI builds and archives, then runs `xcodebuild -exportArchive`
          # itself — without the API key, so export fails with "No Accounts"
          # exactly as the build did before it. Same division of labour one
          # level down: let the CLI get as far as the archive, then export it
          # here where the key can be passed. Its failure is expected, so the
          # archive existing afterwards is what decides whether the build
          # actually worked.
          echo "--- building and archiving ---"
          export NARCO_TOR_XCFRAMEWORK="$TOR_XCF_DEVICE"
          (cd app && npm run tauri ios build -- --export-method app-store-connect) || true

          # `|| true` on the find as well as the build. Under `set -euo
          # pipefail` a failing command substitution ends the script, and find
          # exits non-zero when any search root is missing — which the Archives
          # directory is on a fresh runner. That killed the step one line after
          # the build, making it look like the `|| true` above had not worked.
          mkdir -p "$HOME/Library/Developer/Xcode/Archives"
          archive="$(find app/src-tauri/gen/apple \
                          "$HOME/Library/Developer/Xcode/Archives" \
                          "$HOME/Library/Developer/Xcode/DerivedData" \
                          -name '*.xcarchive' -print 2>/dev/null | head -1 || true)"
          if [ -z "$archive" ]; then
            echo "::error::no .xcarchive was produced — the build itself failed, not the export"
            exit 1
          fi
          echo "archive: $archive"

          echo "--- exporting ---"
          mkdir -p build
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            printf '%s\n' '<plist version="1.0"><dict>'
            printf '%s\n' '<key>method</key><string>app-store-connect</string>'
            printf '%s\n' "<key>teamID</key><string>${APPLE_DEVELOPMENT_TEAM}</string>"
            printf '%s\n' '<key>uploadSymbols</key><true/>'
            printf '%s\n' '</dict></plist>'
          } > build/ExportOptions.plist

          xcodebuild "${auth[@]}" -exportArchive \
            -archivePath "$archive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist build/ExportOptions.plist

          ipa="$(find build/ipa -name '*.ipa' | head -1)"
          test -n "$ipa" || { echo "::error::export produced no .ipa"; exit 1; }
          echo "uploading $ipa"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narco-ios
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/ipa/*.ipa
            app/src-tauri/gen/apple/build/**/*.app
