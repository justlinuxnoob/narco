name: release

# Publishes installers to the Releases page, where people can actually find
# them. CI artifacts are not enough: they are buried under a workflow run,
# require a GitHub login to download, and expire.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

# One run per ref: a new push cancels the superseded one instead of
# queueing behind it and competing for runners.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev build-essential curl wget file libssl-dev

      # The bundler names files from tauri.conf.json, so without this the
      # artifacts carry a stale version and look like an old build.
      - name: Set version from tag
        shell: bash
        run: |
          V="${{ github.event.inputs.tag || github.ref_name }}"
          V="${V#v}"
          node -e "
            const f='app/src-tauri/tauri.conf.json';
            const j=JSON.parse(require('fs').readFileSync(f,'utf8'));
            j.version='$V';
            require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n');
            console.log('version set to', j.version);
          "

      # Ship the C tor daemon alongside the app. Narco drives this binary rather
      # than embedding a Tor library, because the library could not complete
      # circuits on several Windows machines. This is the same build Tor Browser
      # uses. The bundle also carries tor's own libssl/libcrypto/libevent, which
      # must travel with it.
      - name: Fetch Tor Expert Bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PLATFORM="windows-x86_64"
          else
            PLATFORM="linux-x86_64"
          fi

          # Resolve the current version rather than pinning one. dist.torproject
          # .org keeps only recent releases, so a hardcoded version 404s as soon
          # as Tor ships an update — which happened mid-development.
          TOR_VERSION="$(curl -fsSL --retry 3 \
            https://aus1.torproject.org/torbrowser/update_3/release/downloads.json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))")"
          echo "tor version: $TOR_VERSION"

          URL="https://dist.torproject.org/torbrowser/${TOR_VERSION}/tor-expert-bundle-${PLATFORM}-${TOR_VERSION}.tar.gz"
          echo "downloading $URL"
          curl -fsSL --retry 3 -o teb.tar.gz "$URL"
          mkdir -p app/src-tauri/tor
          # Take the daemon and its libraries; skip pluggable transports, which
          # are only needed for censored networks and would add ~30 MB.
          tar xzf teb.tar.gz -C app/src-tauri/tor --strip-components=1 \
            --exclude='pluggable_transports' tor
          ls -la app/src-tauri/tor

      - name: Install frontend
        working-directory: app
        run: npm ci

      # Not an AppImage: linuxdeploy inspects every bundled binary and tries to
      # resolve its libraries, and it fails on the tor daemon's bundled
      # libssl/libcrypto/libevent ("failed to run linuxdeploy"). Reproduced both
      # in CI and locally, and only since tor was bundled. A portable tarball
      # sidesteps the bundler entirely and matches the Windows layout.
      - name: Build (Linux → executable only)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: app
        run: npm run tauri build -- --no-bundle

      - name: Package portable Linux tarball
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.tag || github.ref_name }}"; V="${V#v}"
          STAGE="Narco_${V}_linux_portable"
          mkdir -p "portable/$STAGE"
          cp app/src-tauri/target/release/narco-app "portable/$STAGE/narco"
          chmod +x "portable/$STAGE/narco"
          # find_tor_binary() looks in ./tor beside the executable.
          cp -r app/src-tauri/tor "portable/$STAGE/tor"
          cat > "portable/$STAGE/README.txt" <<'EOF'
          Narco — private chat for two people.

          Run ./narco from this folder.

          Keep the "tor" folder next to the narco executable: the app starts
          that Tor daemon itself. Nothing is installed and nothing is left
          behind when you delete this folder.
          EOF
          tar czf "portable/${STAGE}.tar.gz" -C portable "$STAGE"
          ls -la portable

      # No installer on Windows: just the executable, shipped as a portable zip.
      - name: Build (Windows → executable only)
        if: matrix.os == 'windows-latest'
        working-directory: app
        run: npm run tauri build -- --no-bundle

      # A portable Windows build: the raw exe (frontend embedded), no installer.
      # Just download and run — no install, no SmartScreen install step.
      - name: Package portable Windows zip
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.tag || github.ref_name }}"; V="${V#v}"
          STAGE="Narco_${V}_portable"
          mkdir -p "portable/$STAGE"
          cp app/src-tauri/target/release/narco-app.exe "portable/$STAGE/Narco.exe"
          # find_tor_binary() checks ./tor next to the executable, so the daemon
          # and its DLLs travel with it. A bare .exe would have no Tor at all.
          cp -r app/src-tauri/tor "portable/$STAGE/tor"
          (cd portable && 7z a -tzip "${STAGE}.zip" "$STAGE" >/dev/null)
          ls -la portable

      # AppImage is the one that matters for Arch-family distros, which have no
      # use for the .deb.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Narco ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            Private chat for two people. No accounts, no server, no history.

            **This is early software and has not been audited.** Do not stake
            your safety on it.

            ### Download

            | Platform | File |
            | --- | --- |
            | Linux (any distro) | `_linux_portable.tar.gz` — extract, run `./narco` |
            | Windows | `_portable.zip` — unzip, run `Narco.exe` |

            No installer on either platform: extract and run. Keep the
            executable and the `tor` folder together — the app runs that Tor
            daemon itself.

            Windows will warn that the publisher is unknown, because the build
            is unsigned. Choose **More info → Run anyway**.

            ### First connection takes a few minutes

            Narco has no server. The two apps find each other through the Tor
            network, which means joining Tor and publishing an onion address
            before anything can happen. Joining Tor takes about 10 seconds;
            finding each other takes a couple of minutes. Later connections are
            faster.

            Both people enter the same secret, in the same order if you use
            more than one. Generate a fresh secret for each conversation.
          files: |
            portable/*.zip
            portable/*.tar.gz
