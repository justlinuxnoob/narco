[package]
name = "narco-app"
version = "0.7.4"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "Narco — private two-person chat with no server"
repository = "https://github.com/justlinuxnoob/narco"

[lib]
name = "narco_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
narco-proto = { path = "../../crates/narco-proto" }
narco-tor = { path = "../../crates/narco-tor" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
# "thin" LTO and parallel codegen units cut release builds from ~12 minutes to a
# few, for a binary a couple of hundred KB larger. With Tor pulling in 500+
# crates, full LTO with codegen-units = 1 means optimising the whole graph as a
# single non-parallel unit — a bad trade when the AppImage is already dominated
# by the bundled webview runtime.
lto = "thin"
codegen-units = 16
strip = true
