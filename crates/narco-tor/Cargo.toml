[package]
name = "narco-tor"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "Tor onion-service transport for Narco: the room code becomes the meeting address"
repository = "https://github.com/justlinuxnoob/narco"

# Kept separate from `narco-proto` on purpose. Arti pulls in ~500 crates; the
# protocol crate stays small and dependency-light so it remains practical to
# audit on its own.
[dependencies]
narco-proto = { path = "../narco-proto" }

tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util", "net", "process"] }
zeroize = "1.9"
getrandom = "0.3"
ed25519-dalek = "2"
sha3 = "0.11"
data-encoding = "2"
base64 = "0.23"
sha2 = "0.11"
tracing = "0.1"

# Arti is pulled in only on iOS, which is the one platform that cannot execute
# the tor daemon as a child process. No desktop or Android build compiles or
# even downloads any of this.
[target.'cfg(target_os = "ios")'.dependencies]
arti-client = { version = "0.45", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "onion-service-service",
    "experimental-api",
    "keymgr",
    "ephemeral-keystore",
    "static-sqlite",
] }
tor-hscrypto = "0.45"
tor-hsservice = "0.45"
tor-llcrypto = "0.45"
tor-keymgr = "0.45"
tor-rtcompat = { version = "0.45", features = ["tokio", "rustls"] }
tor-cell = "0.45"
tor-config = "0.45"
safelog = "0.9"
rustls = { version = "0.23", features = ["ring"] }
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
