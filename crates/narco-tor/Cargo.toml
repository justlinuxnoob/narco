[package]
name = "narco-tor"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "Tor onion-service transport for Narco: the room code becomes the meeting address"
repository = "https://github.com/justlinuxnoob/narco"

# Kept separate from `narco-proto` on purpose. Arti pulls in ~500 crates; the
# protocol crate stays small and dependency-light so it remains practical to
# audit on its own.
[dependencies]
narco-proto = { path = "../narco-proto" }

tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util", "net", "process"] }
zeroize = "1.9"
getrandom = "0.3"
ed25519-dalek = "2"
sha3 = "0.11"
data-encoding = "2"
base64 = "0.23"
sha2 = "0.11"
tracing = "0.1"

[features]
# Type-check the iOS-only tor module on any platform. Never enabled by a real
# build; it exists so `cargo check --features check-embedded` catches what only
# an iOS compile would otherwise reveal.
check-embedded = []

[lints.rust]
# Not "forbid": calling tor's C entry point on iOS needs unsafe, and
# forbid cannot be lifted even locally. It is confined to `embedded`,
# which is the only module allowed to use it.
unsafe_code = "deny"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
