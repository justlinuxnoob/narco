[package]
name = "narco-tor"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "Tor onion-service transport for Narco: the room code becomes the meeting address"
repository = "https://github.com/justlinuxnoob/narco"

# Kept separate from `narco-proto` on purpose. Arti pulls in ~500 crates; the
# protocol crate stays small and dependency-light so it remains practical to
# audit on its own.
[dependencies]
narco-proto = { path = "../narco-proto" }

arti-client = { version = "0.45", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "onion-service-service",
    "experimental-api",
    "keymgr",
    "ephemeral-keystore",
    # Compile SQLite from source rather than linking a system library. Arti's
    # directory cache needs it, and Windows has no system sqlite3 to link
    # against — without this the Windows build fails at link time with
    # LNK1181. Enabled on every platform so builds do not vary with whatever
    # SQLite happens to be installed.
    "static-sqlite",
] }
tor-hscrypto = "0.45"
tor-hsservice = "0.45"
tor-llcrypto = "0.45"
tor-keymgr = "0.45"
tor-rtcompat = { version = "0.45", features = ["tokio", "rustls"] }
safelog = "0.9"

tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
futures = "0.3"
zeroize = "1.9"
getrandom = "0.3"
tor-cell = "0.45"
tor-config = "0.45"
rustls = { version = "0.23", features = ["ring"] }

[lints.rust]
unsafe_code = "forbid"
