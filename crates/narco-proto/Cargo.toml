[package]
name = "narco-proto"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "Narco end-to-end encryption protocol: SPAKE2 handshake and ratcheted transport"
repository = "https://github.com/justlinuxnoob/narco"

[dependencies]
# Key agreement. SPAKE2 is what stops a malicious relay from mounting an
# offline dictionary attack on the room code.
spake2 = "0.4"

# Code stretching and key derivation.
# Same story: without this, the BLAKE2b initial hash over the room-code
# material stays in memory after derivation.
argon2 = { version = "0.6", features = ["zeroize"] }
hkdf = "0.13"
sha2 = "0.11"

# Authenticated encryption.
# The `zeroize` feature is NOT on by default. Without it the per-message key
# copied into the cipher object is dropped un-wiped, leaving one copy of every
# message key in freed heap — which quietly falsifies the forward-secrecy claim
# in PROTOCOL.md §5.3, since a memory capture at message n then recovers keys
# 0..n-1.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }

# Constant-time comparison for key confirmation.
subtle = "2.6"

# Key erasure.
zeroize = { version = "1.9", features = ["alloc"] }

# CSPRNG for code generation.
getrandom = "0.3"

# NFC normalization so both devices derive from identical bytes.
unicode-normalization = "0.1"

[lints.rust]
unsafe_code = "forbid"
