		CCC /* bare scalar */ = {
			buildSettings = {
				OTHER_LDFLAGS = "-ObjC";
			};
		};
		DDD /* list across lines */ = {
			buildSettings = {
				FRAMEWORK_SEARCH_PATHS = (
					"$(inherited)",
