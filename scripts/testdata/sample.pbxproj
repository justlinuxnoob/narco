		AAA /* list on one line */ = {
			buildSettings = {
				FRAMEWORK_SEARCH_PATHS = ("$(inherited)", "$(SRCROOT)/Existing");
				OTHER_LDFLAGS = ("$(inherited)", "-ObjC");
